<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marthilu Exclusividades | Marketplace</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra de Contacto -->
  <div class="top-bar">
    <div class="top-bar-container">
      <div class="top-info">
        <span><i class="fas fa-store"></i> Tienda Oficial</span>
        <span>Síguenos:</span>
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
      </div>
    </div>
  </div>

  <!-- Encabezado Principal -->
  <header class="main-header">
    <div class="header-container">
      <a href="#" class="brand-logo">
        <img src="Logo Marhilu local.jfif" alt="Marthilu Exclusividades" class="logo-img">
        <div class="brand-text">
          <span class="brand-name">MARTHILU</span>
          <span class="brand-sub">EXCLUSIVIDADES</span>
        </div>
      </a>

      <!-- Buscador Marketplace -->
      <div class="search-box">
        <input type="text" id="search-input" placeholder="¿Qué estás buscando hoy?">
        <button type="button" id="search-btn"><i class="fas fa-search"></i></button>
      </div>

      <!-- Carrito -->
      <div class="header-actions">
        <button class="action-btn cart-btn" id="open-cart-btn">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-badge" id="cart-count">0</span>
          <span>Mi Carrito</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Filtros Rápidos de Categoría (Pill Buttons) -->
  <nav class="categories-nav">
    <div class="categories-container">
      <button class="category-pill active" onclick="filterCategory('todos')">Todos</button>
      <button class="category-pill" onclick="filterCategory('Regalos')">Regalos</button>
      <button class="category-pill" onclick="filterCategory('Decoración')">Decoración</button>
      <button class="category-pill" onclick="filterCategory('Moda')">Accesorios</button>
      <button class="category-pill" onclick="filterCategory('Cuidado')">Cuidado Personal</button>
      <button class="category-pill" onclick="filterCategory('Ofertas')">Ofertas</button>
    </div>
  </nav>

  <!-- Catálogo Principal de Productos -->
  <main class="marketplace-container">
    <div class="catalog-header">
      <h2>Catálogo de Productos</h2>
      <div class="sort-by">
        <label for="sort-select">Ordenar por:</label>
        <select id="sort-select">
          <option value="featured">Destacados</option>
          <option value="low-high">Precio: Menor a Mayor</option>
          <option value="high-low">Precio: Mayor a Menor</option>
        </select>
      </div>
    </div>

    <!-- Cuadrícula Marketplace -->
    <div class="products-grid" id="products-grid">
      <!-- Los productos se cargan dinámicamente desde script.js -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
