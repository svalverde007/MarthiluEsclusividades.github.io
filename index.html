<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marthilu Exclusividades | Marketplace</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra de Contacto y Redes Sociales -->
  <div class="top-bar">
    <div class="top-bar-container">
      <div class="top-info">
        <span><i class="fas fa-store"></i> Tienda Oficial</span>
        <span>Síguenos:</span>
        <a href="www.facebook.com/servio.sv" target="_blank" rel="noopener noreferrer"><i class="fab fa-facebook-f"></i></a>
        <a href="https://https://www.instagram.com/servio.sv" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i></a>
        <a href="https://www.tiktok.com/@servio.sv" target="_blank" rel="noopener noreferrer"><i class="fab fa-tiktok"></i></a>
        <a href="https://wa.me/593992301548" target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp"></i></a>
      </div>
    </div>
  </div>

  <!-- Encabezado Principal -->
  <header class="main-header">
    <div class="header-container">
      <a href="#" class="brand-logo">
        <img src="Logo Marhilu local.jfif" alt="Marthilu Exclusividades" class="logo-img">
        <div class="brand-text">
          <span class="brand-name">MARTHILU</span>
          <span class="brand-sub">EXCLUSIVIDADES</span>
        </div>
      </a>

      <!-- Buscador Marketplace -->
      <div class="search-box">
        <input type="text" id="search-input" placeholder="¿Qué estás buscando hoy?">
        <button type="button" id="search-btn"><i class="fas fa-search"></i></button>
      </div>

      <!-- Botón Mi Carrito -->
      <div class="header-actions">
        <button class="action-btn cart-btn" id="open-cart-btn">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-badge" id="cart-count">0</span>
          <span>Mi Carrito</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Filtros Rápidos de Categoría -->
  <nav class="categories-nav">
    <div class="categories-container">
      <button class="category-pill active" onclick="filterCategory('todos')">Todos</button>
      <button class="category-pill" onclick="filterCategory('Regalos y Exclusividades')">Regalos</button>
      <button class="category-pill" onclick="filterCategory('Decoración de Hogar')">Decoración</button>
      <button class="category-pill" onclick="filterCategory('Accesorios de Moda')">Accesorios</button>
      <button class="category-pill" onclick="filterCategory('Cuidado Personal')">Cuidado Personal</button>
    </div>
  </nav>

  <!-- Catálogo Principal de Productos -->
  <main class="marketplace-container">
    <div class="catalog-header">
      <h2>Catálogo de Productos</h2>
      <div class="sort-by">
        <label for="sort-select">Ordenar por:</label>
        <select id="sort-select">
          <option value="featured">Destacados</option>
          <option value="low-high">Precio: Menor a Mayor</option>
          <option value="high-low">Precio: Mayor a Menor</option>
        </select>
      </div>
    </div>

    <!-- Cuadrícula de productos -->
    <div class="products-grid" id="products-grid"></div>
  </main>

  <!-- PANEL LATERAL DEL CARRITO -->
  <div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-modal" id="cart-modal">
    <div class="cart-header">
      <h3><i class="fas fa-shopping-cart"></i> Tu Carrito de Compras</h3>
      <button class="close-cart-btn" id="close-cart-btn">&times;</button>
    </div>

    <div class="cart-items-container" id="cart-items-container">
      <!-- Los productos añadidos aparecerán aquí -->
    </div>

    <div class="cart-footer">
      <div class="cart-total-row">
        <span>Total:</span>
        <strong id="cart-total-price">$0.00</strong>
      </div>
      <button class="btn-checkout" id="checkout-btn" onclick="sendWhatsAppOrder()">
        <i class="fab fa-whatsapp"></i> Finalizar Pedido por WhatsApp
      </button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
